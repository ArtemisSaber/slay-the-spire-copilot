name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  actions: read
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: slay-the-spire-copilot-linux-x86_64
            exe_suffix: ""
          - os: macos-latest
            artifact_name: slay-the-spire-copilot-macos
            exe_suffix: ""
          - os: windows-latest
            artifact_name: slay-the-spire-copilot-windows-x86_64
            exe_suffix: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Package artifact (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          package="${{ matrix.artifact_name }}"
          binary="target/release/slay-the-spire-copilot${{ matrix.exe_suffix }}"

          mkdir -p "dist" "$package"
          cp "$binary" "$package/"
          cp target/release/rules.json "$package/"
          cp README.md "$package/"
          cp .env.example "$package/"

          tar -czf "dist/$package.tar.gz" "$package"

      - name: Package artifact (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "${{ matrix.artifact_name }}"
          $binary = "target/release/slay-the-spire-copilot${{ matrix.exe_suffix }}"

          New-Item -ItemType Directory -Force -Path "dist", $package | Out-Null
          Copy-Item $binary -Destination $package
          Copy-Item "target/release/rules.json" -Destination $package
          Copy-Item "README.md" -Destination $package
          Copy-Item ".env.example" -Destination $package

          Compress-Archive -Path $package -DestinationPath "dist/$package.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="$(cat <<EOF
          Automated release for ${TAG}.

          Download the archive for your operating system, extract it, copy .env.example to .env, and configure CommunicationMod to run the binary.
          EOF
          )"

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GH_REPO" --title "$TAG" --notes "$notes"
          fi
