name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: slay-the-spire-copilot-linux-x86_64
            exe_suffix: ""
            archive_ext: tar.gz
          - os: macos-latest
            artifact_name: slay-the-spire-copilot-macos
            exe_suffix: ""
            archive_ext: tar.gz
          - os: windows-latest
            artifact_name: slay-the-spire-copilot-windows-x86_64
            exe_suffix: ".exe"
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          package="${{ matrix.artifact_name }}"
          binary="target/release/slay-the-spire-copilot${{ matrix.exe_suffix }}"

          mkdir -p "dist" "$package"
          cp "$binary" "$package/"
          cp README.md "$package/"
          cp .env.example "$package/"

          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$package' -DestinationPath 'dist/$package.zip' -Force"
          else
            tar -czf "dist/$package.tar.gz" "$package"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="Automated release for ${TAG}.

Download the archive for your operating system, extract it, copy .env.example to .env, and configure CommunicationMod to run the binary."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes "$notes"
          fi
